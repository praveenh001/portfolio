<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Project Not Deployed</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            max-width: 650px;
            padding: 40px 25px;
        }

        .error-code {
            font-size: 120px;
            font-weight: 800;
            letter-spacing: -8px;
            color: #ffffff;
            line-height: 1;
            margin-bottom: 20px;
        }

        .title {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .message {
            color: #999;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            border: 1px solid #333;
            border-radius: 30px;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .dot {
            width: 9px;
            height: 9px;
            background: #ffb000;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffb000;
        }

        .back-btn {
            display: inline-block;
            padding: 13px 25px;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .back-btn:hover {
            background: #dddddd;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 45px;
            color: #555;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .error-code {
                font-size: 85px;
            }

            .title {
                font-size: 25px;
            }

            .message {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="error-code">404</div>

        <div class="status">
            <span class="dot"></span>
            Project Not Deployed
        </div>

        <h1 class="title">This Project Isn't Live Yet</h1>

        <p class="message">
            The project you're looking for has not been deployed yet.
            Please check back later once it is available online.
        </p>

        <a href="/" class="back-btn">← Go Back</a>

        <div class="footer">
            © 2026 Praveen • Portfolio
        </div>

    </div>

</body>
</html>
