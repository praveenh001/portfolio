    :root {

      background: #c2ef00;
    }

    /* Marquee */
    .marquee-row {
      overflow: hidden;
      white-space: nowrap;
    }

    .marquee-track {
      display: inline-flex;
      width: max-content;
      animation: marquee-left 16s linear infinite;
    }

    .marquee-track.reverse {
      animation: marquee-right 16s linear infinite;
    }

    @keyframes marquee-left {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    @keyframes marquee-right {
      from {
        transform: translateX(-50%);
      }

      to {
        transform: translateX(0);
      }
    }

    /* Dotted globe backdrop */
    .dotted-globe {
      background-image: radial-gradient(rgba(215, 255, 30, 0.55) 1px, transparent 1.5px);
      background-size: 14px 14px;
      -webkit-mask-image: radial-gradient(circle at 20% 50%, black 0%, black 35%, transparent 68%);
      mask-image: radial-gradient(circle at 20% 50%, black 0%, black 35%, transparent 68%);
    }

    ::selection {
      background: var(--lime);
      color: #08110a;
    }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--lime);
      outline-offset: 3px;
    }

    /* Splash intro */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: #040404;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity .6s ease, visibility .6s ease;
    }

    #splash.leaving {
      opacity: 0;
      visibility: hidden;
    }

    .splash-caret {
      display: inline-block;
      width: 3px;
      height: 0.85em;
      background: var(--lime);
      margin-left: 6px;
      animation: blink 1s steps(1) infinite;
      vertical-align: -0.1em;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .marquee-track,
      .marquee-track.reverse {
        animation: none;
      }

      html {
        scroll-behavior: auto;
      }

      #splash {
        transition: none;
      }
    }

    /* Scroll Focus & Reveal Animations */
    .scroll-section {
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
        filter 0.8s ease;
      will-change: opacity, transform, filter;
    }

    /* Upcoming section: below viewport focus area */
    .scroll-section.is-upcoming {
      opacity: 0.35;
      transform: translateY(40px) scale(0.97);
      filter: brightness(0.7) blur(0.5px);
    }

    /* Active section: bright, vivid, full focus */
    .scroll-section.is-active {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: brightness(1.15) contrast(1.05) blur(0px);
    }

    /* Passed section: scrolled above - dimmed/lightened */
    .scroll-section.is-passed {
      opacity: 0.35;
      transform: translateY(-25px) scale(0.97);
      filter: brightness(0.6) grayscale(30%);
    }

    @media (prefers-reduced-motion: reduce) {
      .scroll-section {
        transition: none !important;
        transform: none !important;
        filter: none !important;
        opacity: 1 !important;
      }
    }

    /* ---------------------------------------------------------
       SPLASH INTRO (PORTFOLIO -> PRAVEEN H SCRAMBLE MORPH)
    --------------------------------------------------------- */
    function Splash({ onDone }) {
      const [leaving, setLeaving] = useState(false);
      const targetText = "PRAVEEN H";
      const [displayText, setDisplayText] = useState("PORTFOLIO");
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#@$%&*!?";

      useEffect(() => {
        document.body.style.overflow = "hidden";

        // Fast scramble morph from PORTFOLIO to h after 300ms
        const scrambleTimer = setTimeout(() => {
          let step = 0;
          const totalSteps = targetText.length * 3;

          const interval = setInterval(() => {
            setDisplayText(
              targetText
                .split("")
                .map((char, index) => {
                  if (char === " ") return " ";
                  if (index < step / 3) {
                    return char;
                  }
                  return chars[Math.floor(Math.random() * chars.length)];
                })
                .join("")
            );

            if (step >= totalSteps) {
              clearInterval(interval);
              setDisplayText(targetText);
            }

            step += 1;
          }, 18);
        }, 300);

        const t1 = setTimeout(() => setLeaving(true), 2100);
        const t2 = setTimeout(() => {
          document.body.style.overflow = "auto";
          onDone();
        }, 2600);

        return () => {
          clearTimeout(scrambleTimer);
          clearTimeout(t1);
          clearTimeout(t2);
        };
      }, []);

      const skip = () => {
        document.body.style.overflow = "auto";
        setLeaving(true);
        setTimeout(onDone, 300);
      };

      return (
        <div id="splash" className={leaving ? "leaving" : ""} onClick={skip} role="button" aria-label="Skip intro">
          <p className="font-mono text-xs tracking-[0.3em] text-[var(--lime)] mb-4">WELCOME TO MY</p>

          </h1>
          <p className="mt-6 text-white/40 text-[11px] tracking-[0.25em]">CLICK OR WAIT TO CONTINUE</p>
        </div>
      );
    }

    function ProjectCard({ project }) {
      const [transform, setTransform] = useState({ rotateX: 0, rotateY: 0, scale: 1 });

      const handleMouseMove = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const mouseX = e.clientX - centerX;
        const mouseY = e.clientY - centerY;

        const rotateX = -(mouseY / (rect.height / 2)) * 7;
        const rotateY = (mouseX / (rect.width / 2)) * 7;

        setTransform({ rotateX, rotateY, scale: 1.02 });
      };

      const handleMouseLeave = () => {
        setTransform({ rotateX: 0, rotateY: 0, scale: 1 });
      };

      return (
        <div
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          className="group relative bg-[#0c0d12] border border-white/10 hover:border-[var(--lime)]/80 rounded-2xl p-6 md:p-8 flex flex-col h-full transition-all duration-300 shadow-lg hover:shadow-[0_20px_50px_rgba(0,0,0,0.8),0_0_30px_rgba(215,255,30,0.15)] overflow-hidden"

            <p>© {new Date().getFullYear()} {NAME}. All rights reserved.</p>
            <a href="#home" className="hover:text-[var(--lime)] transition-colors">Back to top ↑</a>
          </div>
        </footer>
      );
    }

    /* ---------------------------------------------------------
       APP
    --------------------------------------------------------- */
    function App() {
      const [splashDone, setSplashDone] = useState(false);
      const [scrolledPastHero, setScrolledPastHero] = useState(false);
      const [activeSection, setActiveSection] = useState("home");
      const [navVisible, setNavVisible] = useState(false);

      const parentRef = useRef(null);
      const heroPlaceholderRef = useRef(null);
      const aboutPlaceholderRef = useRef(null);
      const transitionImageRef = useRef(null);
      const [coords, setCoords] = useState(null);
      const [showHeroImage, setShowHeroImage] = useState(false);
      const [transitionComplete, setTransitionComplete] = useState(false);

      const coordsRef = useRef(null);
      const transitionCompleteRef = useRef(false);

      const measureCoords = () => {
        if (!parentRef.current || !heroPlaceholderRef.current || !aboutPlaceholderRef.current) return;

        const homeEl = document.getElementById("home");
        const aboutEl = document.getElementById("about");

        if (!homeEl || !aboutEl) return;

        // Temporarily reset section transforms to get correct natural layout coordinates
        const homePrevTransform = homeEl.style.transform;
        const homePrevTransition = homeEl.style.transition;
        const aboutPrevTransform = aboutEl.style.transform;
        const aboutPrevTransition = aboutEl.style.transition;

        homeEl.style.transform = "none";
        homeEl.style.transition = "none";
        aboutEl.style.transform = "none";
        aboutEl.style.transition = "none";

        const parentRect = parentRef.current.getBoundingClientRect();
        const heroRect = heroPlaceholderRef.current.getBoundingClientRect();
        const aboutRect = aboutPlaceholderRef.current.getBoundingClientRect();

        // Restore transforms immediately
        homeEl.style.transform = homePrevTransform;
        homeEl.style.transition = homePrevTransition;
        aboutEl.style.transform = aboutPrevTransform;
        aboutEl.style.transition = aboutPrevTransition;

        const aboutSection = document.getElementById("about");
        const sEnd = aboutSection ? aboutSection.offsetTop : 800;

        const newCoords = {
          hero: {
            top: heroRect.top - parentRect.top,
            left: heroRect.left - parentRect.left,
            width: heroRect.width,
            height: heroRect.height,
          },
          about: {
            top: aboutRect.top - parentRect.top,
            left: aboutRect.left - parentRect.left,
            width: aboutRect.width,
            height: aboutRect.height,
          },
          sStart: 0,
          sEnd: sEnd,
        };

        coordsRef.current = newCoords;
        setCoords(newCoords);
      };

      useEffect(() => {
        if (!splashDone) return;
        // Step 3: Navbar slides down 1.0s (1000ms) after Splash screen ends
        const timer = setTimeout(() => setNavVisible(true), 1000);
        return () => clearTimeout(timer);
      }, [splashDone]);

      useEffect(() => {
        if (!splashDone) return;

        // Measure once when splash is done
        requestAnimationFrame(() => {
          measureCoords();
        });

        // Intro animation timer
        const timer = setTimeout(() => setShowHeroImage(true), 500);

        const handleScroll = () => {
          const scrollY = window.scrollY;
          setScrolledPastHero(scrollY > 220);

          const sections = document.querySelectorAll(".scroll-section");
          if (!sections.length) return;

          const viewportCenter = window.innerHeight * 0.45;

          let current = "home";
          sections.forEach((sec) => {
            const rect = sec.getBoundingClientRect();
            if (rect.top <= viewportCenter + 120 && rect.bottom >= viewportCenter - 120) {
              sec.classList.add("is-active");
              sec.classList.remove("is-passed", "is-upcoming");
              if (sec.id) current = sec.id;
            } else if (rect.bottom < viewportCenter - 120) {
              sec.classList.add("is-passed");
              sec.classList.remove("is-active", "is-upcoming");
            } else {
              sec.classList.add("is-upcoming");
              sec.classList.remove("is-active", "is-passed");
            }
          });

          setActiveSection(current);

          // Update transitioning image and check handoff boundary
          if (coordsRef.current && transitionImageRef.current) {
            const { hero, about, sStart, sEnd } = coordsRef.current;
            const isEnd = scrollY >= sEnd;
            const p = Math.max(0, Math.min(1, (scrollY - sStart) / (sEnd - sStart)));
            const img = transitionImageRef.current;

            // Trigger React state update ONLY when boundary state changes
            if (isEnd !== transitionCompleteRef.current) {
              transitionCompleteRef.current = isEnd;
              setTransitionComplete(isEnd);
            }

            if (isEnd) {
              // Smooth handoff: hide transition image and show About profile image
              img.style.opacity = "0";
              img.style.pointerEvents = "none";
            } else if (scrollY > 0) {
              img.style.transition = "none";
              img.style.transform = "none";
              img.style.opacity = "1";
              img.style.pointerEvents = "auto";
            } else {
              img.style.transition = "opacity 1200ms cubic-bezier(0.16, 1, 0.3, 1), transform 1200ms cubic-bezier(0.16, 1, 0.3, 1)";
              img.style.transform = showHeroImage ? "translate3d(0, 0, 0) scale(1)" : "translate3d(0, 144px, 0) scale(0.95)";
              img.style.opacity = showHeroImage ? "1" : "0";
              img.style.pointerEvents = "none";
            }

            const top = hero.top + (about.top - hero.top) * p;
            const left = hero.left + (about.left - hero.left) * p;
            const width = hero.width + (about.width - hero.width) * p;
            const height = hero.height + (about.height - hero.height) * p;

            const tl = 24 + (16 - 24) * p;
            const tr = 24 + (16 - 24) * p;
            const bl = 0 + (16 - 0) * p;
            const br = 0 + (16 - 0) * p;

            const borderWidth = 0 + (2 - 0) * p;
            const borderOpacity = 0 + (0.8 - 0) * p;

            img.style.top = `${top}px`;
            img.style.left = `${left}px`;
            img.style.width = `${width}px`;
            img.style.height = `${height}px`;
            img.style.borderTopLeftRadius = `${tl}px`;
            img.style.borderTopRightRadius = `${tr}px`;
            img.style.borderBottomLeftRadius = `${bl}px`;
            img.style.borderBottomRightRadius = `${br}px`;
            img.style.borderWidth = `${borderWidth}px`;
            img.style.borderColor = `rgba(0, 0, 0, ${borderOpacity})`;

            const shadowOpacity = 0.25 + (0.15 - 0.25) * p;
            img.style.boxShadow = `0 ${25 - (25 - 4) * p}px ${50 - (50 - 6) * p}px -${12 - (12 - 1) * p}px rgba(0,0,0,${shadowOpacity})`;
          }
        };

        window.addEventListener("scroll", handleScroll, { passive: true });
        window.addEventListener("resize", measureCoords);
        handleScroll();

        return () => {
          clearTimeout(timer);
          window.removeEventListener("scroll", handleScroll);
          window.removeEventListener("resize", measureCoords);
        };
      }, [splashDone, showHeroImage]);

      return (
        <div>
          {!splashDone && <Splash onDone={() => setSplashDone(true)} />}
          <Navbar hide={scrolledPastHero || !navVisible} />
          <div ref={parentRef} className="relative">
            <Hero
              splashDone={splashDone}
              placeholderRef={heroPlaceholderRef}
              onPlaceholderLoad={measureCoords}
            />
            <About
              placeholderRef={aboutPlaceholderRef}
              onPlaceholderLoad={measureCoords}
              isImageVisible={transitionComplete}
            />
            {coords && (
              <img
                ref={transitionImageRef}
                src="praveen1.png"
                alt="PRAVEEN H"
                className="absolute object-cover object-top pointer-events-none z-20"
                style={{
                  top: `${coords.hero.top}px`,
                  left: `${coords.hero.left}px`,
                  width: `${coords.hero.width}px`,
                  height: `${coords.hero.height}px`,
                  borderTopLeftRadius: "24px",
                  borderTopRightRadius: "24px",
                  borderBottomLeftRadius: "0px",
                  borderBottomRightRadius: "0px",
                  borderWidth: "0px",
                  borderColor: "transparent",
                  boxShadow: "0 25px 50px -12px rgba(0,0,0,0.25)",
                  transition: "opacity 1200ms cubic-bezier(0.16, 1, 0.3, 1), transform 1200ms cubic-bezier(0.16, 1, 0.3, 1)",
                  transform: showHeroImage ? "translate3d(0, 0, 0) scale(1)" : "translate3d(0, 144px, 0) scale(0.95)",
                  opacity: showHeroImage ? 1 : 0,
                }}
              />
            )}
          </div>
          <SkillsMarquee />
          <Skills />
          <Work />
          <Contact />
          <Footer />
          <FloatingDock visible={scrolledPastHero} activeSection={activeSection} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
